<style>

}

  --bg:#12181b; --panel:#1a2226; --ink:#e6edf0; --mute:#97a6ad; --line:#2d3a40; --soft:#222d32;
  --accent:#6fb8cd; --accent-ink:#0d1a1f; --miss:#ff8a80; --miss-bg:#3a1f1d; --warn:#f2c35b; --warn-bg:#3a2f14;
  --ok:#7fd29a; --ok-bg:#1b3325; --info-bg:#1b2d34; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12181b; --panel:#1a2226; --ink:#e6edf0; --mute:#97a6ad; --line:#2d3a40; --soft:#222d32;
  --accent:#6fb8cd; --accent-ink:#0d1a1f; --miss:#ff8a80; --miss-bg:#3a1f1d; --warn:#f2c35b; --warn-bg:#3a2f14;
  --ok:#7fd29a; --ok-bg:#1b3325; --info-bg:#1b2d34; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

@media (max-width:560px){h1{font-size:22px}.big{font-size:19px}}

<div class="wrap" id="app"></div>

<script>
const API = (window.parent && window.parent !== window && window.parent.AppApi) || window.AppApi || null;
const _$ = s => document.querySelector(s);
async function boot() {
  const app = _$('#app');
  if (!API) { app.innerHTML = '<div class="panel"><div class="alert miss">Questa pagina funziona dentro Brigade 2 (Catering → Food cost catering).</div></div>'; return; }
  app.innerHTML = '<div class="panel"><div class="note">Leggo eventi, menu, prezzi e costi da Brigade…</div></div>';
  try { const SV = await API.call('cc_load', {}); START(SV.D, SV); }
  catch (e) { app.innerHTML = '<div class="panel"><div class="alert miss">Non riesco a leggere i dati (' + (e && (e.code || e.message) || 'offline') + '). <button onclick="location.reload()">Riprova</button></div></div>'; }
}
function START(D, SV) {
const NMAX = 220;
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = n => (n < 0 ? '-' : '') + '$' + Math.abs(n).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const money4 = n => '$' + n.toFixed(4);
const up = x => Math.ceil(x * 100 - 1e-9) / 100;               // regola ADM03: arrotondo per eccesso al centesimo
const fq = n => (Math.round(n * 100) / 100).toLocaleString('en-US', {maximumFractionDigits: 2});
const dmy = iso => { if (!iso) return ''; const [y, m, d] = iso.split('-'); return m + '/' + d; };   // americano: mese/giorno
const fdate = iso => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString('en-US', {weekday: 'short', month: 'long', day: 'numeric'}); };

// ---------------------------------------------------------------- stato
// ---------------------------------------------------------------- stato: salvato in Brigade (una versione per salvataggio), non nel browser
let S = {mode: (SV.prefs && SV.prefs.mode) || 'br', buffer: SV.prefs ? SV.prefs.buffer !== false : true, ui: {filter: 'tutti', cancelled: false}, ev: {}, ver: {}, prefsVer: SV.prefs_ver || 0};
for (const [k, v] of Object.entries(SV.states || {})) { S.ev[k] = v.state; S.ver[k] = v.ver; }
const dirty = new Set(), conflicts = {}, restoreNote = {}; let timer = null, sync = {state: 'saved'}, hist = null;
const LOCAL_KEY = 'b99-catering-v1';
const local = (() => { try { const x = JSON.parse(localStorage.getItem(LOCAL_KEY) || 'null'); return x && x.v === 1 && x.s && x.s.ev ? x.s : null; } catch (e) { return null; } })();
const importable = local ? Object.keys(local.ev).filter(k => !(SV.states || {})[k] && D.events.some(e => e.id === k)) : [];
function paintSync() {
  const el = document.getElementById('sync'); if (!el) return;
  const t = {saved: ['b-ok', 'salvato in Brigade'], saving: ['b-warn', 'salvo…'], error: ['b-miss', 'non riesco a salvare (riprovo)'], conflict: ['b-miss', 'conflitto: guarda la scheda']}[sync.state];
  el.className = 'badge ' + t[0]; el.textContent = t[1];
}
function save(key) {
  if (!key) return;
  if (key !== '_prefs') { const e = D.events.find(x => x.id === key); if (e && e.menu_hash && S.ev[key] && !S.ev[key].mh) S.ev[key].mh = e.menu_hash; }
  dirty.add(key); sync = {state: 'saving'}; paintSync(); clearTimeout(timer); timer = setTimeout(flush, 600);
}
async function flush() {
  clearTimeout(timer);
  for (const key of [...dirty]) {
    if (conflicts[key] != null) continue;
    dirty.delete(key);
    const state = key === '_prefs' ? {mode: S.mode, buffer: S.buffer} : S.ev[key], base = key === '_prefs' ? S.prefsVer : (S.ver[key] || 0);
    try {
      const r = await API.call('cc_save', {key, state, base_ver: base, note: restoreNote[key] || null}); delete restoreNote[key];
      if (r.ok) { if (key === '_prefs') S.prefsVer = r.ver; else S.ver[key] = r.ver; }
      else { conflicts[key] = r.ver; dirty.add(key); }
    } catch (e) { dirty.add(key); sync = {state: 'error'}; paintSync(); timer = setTimeout(flush, 6000); return; }
  }
  sync = Object.keys(conflicts).length ? {state: 'conflict'} : dirty.size ? {state: 'saving'} : {state: 'saved'}; paintSync();
  if (sync.state === 'conflict') render();
}
document.addEventListener('visibilitychange', () => { if (document.hidden && dirty.size) flush(); });
window.addEventListener('beforeunload', e => { if (dirty.size) { e.preventDefault(); e.returnValue = ''; } });
function evState(e) {
  if (!S.ev[e.id]) S.ev[e.id] = {guests: e.guests, mp: e.menu_price, mq: e.menu_qty, dishes: {}, extras: [], clone: false, ovr: {}};
  return S.ev[e.id];
}
const dk = (d, i) => d.id != null ? String(d.id) : String(i);   // chiave del piatto (i vecchi eventi curati: la posizione di prima, quindi le modifiche già fatte restano valide)
function dState(es, i) { if (!es.dishes[i]) es.dishes[i] = {N: null, man: {}}; return es.dishes[i]; }
const evById = id => D.events.find(e => e.id === id);
const INGBY = Object.fromEntries(D.ing.map(x => [x.id, x]));
const RECBY = Object.fromEntries(D.rec.map(x => [x.id, x]));

// ---------------------------------------------------------------- calcolo
function priceFor(e, pid, ovrKey, es) {
  const pr = D.prices[pid], c = D.check[e.id][pid];
  const o = es.ovr[ovrKey];
  if (o != null && o !== '') return {p: +o, st: 'PREZZO INSERITO DA TE', src: 'inserito nella pagina', manual: true};
  if (S.mode === 'br' && c && c.use === 'br' && c.br && c.br.p != null)
    return {p: c.br.p, st: 'FATTURA BRIGADE ' + dmy(c.br.date), src: (c.br.v || '') + (c.br.pack ? ' · ' + c.br.pack : '') + (c.br.inv ? ' · fatt. ' + c.br.inv : ''), brig: true};
  if (pr.p == null) return {p: null, st: 'PREZZO MANCANTE', src: pr.s};
  return {p: pr.p, st: pr.st, src: pr.v + ' · ' + pr.s};
}
function evalDish(e, es, d, i) {
  const ds = dState(es, dk(d, i));
  const out = {label: d.label, lines: [], cost: 0, missing: 0, pending: false, qlabel: '', conf: d.conf, hint: d.hint, manual: !!d.manual, N: null, notes: []};
  if (d.rule) {
    const N = ds.N == null ? (d.n0 ? 0 : es.guests) : ds.N; out.N = N;
    const t = D.rules[d.rkey][Math.max(0, Math.min(NMAX, Math.round(N)))];
    out.qlabel = t[0]; out.notes = t[2];
    for (const [pid, q] of t[1]) {
      const pr = D.prices[pid], pf = priceFor(e, pid, dk(d, i) + '|' + pid, es);
      const l = {key: dk(d, i) + '|' + pid, desc: pr.d, q, u: pr.u, p: pf.p, st: pf.st, src: pf.src, manual: pf.manual, brig: pf.brig, cost: pf.p == null ? null : q * pf.p, canFix: true};
      if (l.cost == null) out.missing++; else out.cost += l.cost;
      out.lines.push(l);
    }
    if (N <= 0) out.pending = true;
  } else {
    // piatto senza regola catering: porzioni scritte da te x costo della ricetta del ristorante
    out.pending = true;
    for (const rid of d.recids) {
      const r = RECBY[rid]; if (!r) continue;
      const port = +(ds.man[rid] || 0);
      const base = r.cpp == null && r.cpu != null;   // ricetta base senza porzioni: costo al grammo/ml dalla resa
      const rp = base ? r.cpu : r.cpp;
      const l = {key: dk(d, i) + '|' + rid, desc: r.t + ' (ricetta ristorante)', q: port, u: base ? r.cu : 'porz.', p: rp, st: rp == null ? 'COSTO NON CALCOLABILE' : (base ? 'DA FATTURE (ricetta base, a ' + r.cu + ')' : (r.part ? 'COSTO PARZIALE' : 'DA FATTURE')),
        src: (r.miss.length ? 'mancano: ' + r.miss.join(', ') : (base ? 'costo Brigade per ' + r.cu + ' dalla resa' : 'costo Brigade')), part: r.part, rec: rid, cost: rp == null ? null : port * rp, miss: r.miss};
      if (port > 0) { out.pending = false; if (l.cost == null || r.part) out.missing++; }
      if (l.cost != null) out.cost += l.cost;
      out.lines.push(l);
    }
    if (!d.recids.length) out.pending = true;
  }
  return out;
}
function unitFactor(u) { return {g: 1, kg: 1000, oz: 28.3495, lb: 453.592, ml: 1, l: 1000, 'fl oz': 29.5735, gal: 3785.41, pz: 1}[u]; }
function evalExtra(e, es, x, k) {
  const l = {key: 'x|' + k, extra: k, q: x.qty, u: x.unit, cost: null, p: null, st: '', src: '', desc: ''};
  if (x.type === 'rec') {
    const r = RECBY[x.refId]; if (!r) { l.desc = (x.name || 'ricetta') + ' (ricetta non più in Brigade)'; l.st = 'COSTO NON CALCOLABILE'; return l; }
    l.desc = r.t + ' (ricetta ristorante)'; l.u = 'porz.';
    // unità scelte: 'porz.' (costo per porzione) oppure grammi/ml/kg/lb... per le ricette base (costo dalla resa)
    let uu = x.unit || 'porz.';
    if (uu === 'porz.' && r.cpp == null && r.cpu != null) uu = r.cu;   // vecchie righe: ricetta base senza porzioni = grammi/ml
    const base = uu !== 'porz.' && r.cpu != null && unitFactor(uu) != null;
    l.u = base ? uu : 'porz.';
    l.p = base ? r.cpu * unitFactor(uu) : r.cpp; l.part = r.part; l.miss = r.miss;
    l.st = l.p == null ? 'COSTO NON CALCOLABILE' : (base ? 'DA FATTURE (ricetta base, a ' + uu + ')' : (r.part ? 'COSTO PARZIALE' : 'DA FATTURE'));
    l.src = r.miss.length ? 'mancano: ' + r.miss.join(', ') : (base ? 'costo Brigade dalla resa della ricetta' : 'costo Brigade');
    if (x.price != null && x.price !== '') { l.p = +x.price; l.st = 'PREZZO INSERITO DA TE'; l.manual = true; l.part = false; }
    l.cost = l.p == null ? null : x.qty * l.p;
    return l;
  }
  const g = INGBY[x.refId]; if (!g) { l.desc = (x.name || 'articolo') + ' (non più in Brigade)'; l.st = 'PREZZO MANCANTE'; return l; }
  l.desc = g.n;
  let p = null, st = '', src = '';
  const f = unitFactor(x.unit);
  if (x.price != null && x.price !== '') { p = +x.price; st = 'PREZZO INSERITO DA TE'; l.manual = true; l.cost = x.qty * p; l.p = p; l.st = st; l.src = 'prezzo per ' + x.unit; return l; }
  if (['g', 'kg', 'oz', 'lb'].includes(x.unit) && g.pg != null) { p = g.pg * f; }
  else if (['ml', 'l', 'fl oz', 'gal'].includes(x.unit) && g.pm != null) { p = g.pm * f; }
  else if (x.unit === 'pz' && g.pe != null) { p = g.pe; }
  src = (g.v || 'nessuna fattura') + (g.d ? ' · ' + dmy(g.d) : '') + (g.pack ? ' · ' + g.pack : '');
  if (p == null) { l.st = 'PREZZO MANCANTE'; l.src = g.pg == null && g.pm == null && g.pe == null ? 'nessun prezzo in Brigade' : 'prezzo in Brigade ma non per questa unità'; return l; }
  l.p = p; l.cost = x.qty * p; l.st = g.stima ? 'STIMA CHEF (non fattura)' : 'FATTURA BRIGADE ' + dmy(g.d); l.src = src;
  return l;
}
function evalEvent(e) {
  const es = evState(e);
  const dishes = e.dishes.map((d, i) => evalDish(e, es, d, i));
  const extras = es.extras.map((x, k) => evalExtra(e, es, x, k));
  let total = dishes.reduce((s, d) => s + d.cost, 0) + extras.reduce((s, l) => s + (l.cost || 0), 0);
  let missing = dishes.reduce((s, d) => s + d.missing, 0) + extras.filter(l => l.cost == null || l.part).length;
  const pending = dishes.filter(d => d.pending).length;
  const buf = S.buffer ? total * 0.10 : 0, fin = total + buf;
  const rev = (es.mp || 0) * (es.mq || 0);
  return {es, dishes, extras, total, buf, fin, missing, pending, rev};
}

// ---------------------------------------------------------------- vista
function lineRow(e, ev, l, i) {
  const miss = l.cost == null;
  const stc = miss ? 'b-miss' : (l.manual ? 'b-info' : (/PARZIALE|STIMA|PROVVIS|PROVISIONAL|UNKNOWN|CHEF STANDARD/i.test(l.st) ? 'b-warn' : (l.brig || /FATTURA|FATTURE|VERIFIED/.test(l.st) ? 'b-ok' : 'b-info')));
  const stl = {VERIFIED: 'DA FATTURA', PROVISIONAL: 'PROVVISORIO', UNKNOWN: 'SCONOSCIUTO', 'CHEF STANDARD': 'STANDARD CHEF'}[l.st] || l.st;
  let fix = '';
  if (l.canFix && (miss || l.manual)) {
    fix = `<input class="p num" type="number" step="0.0001" min="0" placeholder="$/${esc(l.u)}" data-fid="ovr-${esc(e.id)}-${esc(l.key)}" data-act="ovr" data-ev="${e.id}" data-k="${esc(l.key)}" value="${l.manual ? l.p : ''}" aria-label="Prezzo per ${esc(l.desc)}">`;
  }
  if (l.extra != null && (miss || l.manual)) {
    fix = `<input class="p num" type="number" step="0.0001" min="0" placeholder="$/${esc(l.u)}" data-fid="xp-${esc(e.id)}-${l.extra}" data-act="xprice" data-ev="${e.id}" data-k="${l.extra}" value="${l.manual ? l.p : ''}" aria-label="Prezzo inserito da te">`;
  }
  return `<tr class="${miss ? 'miss' : ''}">
    <td>${esc(l.desc)}${l.src ? `<div class="note">${esc(l.src)}</div>` : ''}${l.miss && l.miss.length && !l.manual ? `<div class="note warn">mancano: ${esc(l.miss.join(', '))}</div>` : ''}</td>
    <td class="r num">${fq(l.q)} ${esc(l.u)}</td>
    <td class="r num">${l.p == null ? '—' : money4(l.p)}</td>
    <td class="r num">${miss ? '<b>MANCANTE</b>' : money4(l.cost)}</td>
    <td><span class="badge ${stc}">${esc(stl)}</span></td>
    <td>${fix}</td></tr>`;
}
function linesTable(e, ev, lines) {
  return `<div class="scroll"><table class="lines"><thead><tr><th>Ingrediente</th><th class="r">Quantità</th><th class="r">Prezzo unit.</th><th class="r">Costo</th><th>Stato prezzo</th><th>Prezzo mancante?</th></tr></thead><tbody>${lines.map(l => lineRow(e, ev, l)).join('')}</tbody></table></div>`;
}
function sourceChips(e, es) {
  return e.fonti.map(([lab, n], k) => `<button class="chip ${es.guests === n ? 'on' : ''}" data-act="guestsrc" data-ev="${e.id}" data-n="${n}" title="${esc(lab)}">${n} · ${esc(lab)}</button>`).join(' ');
}
function dishHtml(e, ev, d, i, dd) {
  const es = ev.es, key = e.id + '#' + i, open = S.ui[key];
  let ctl;
  if (d.rule) {
    ctl = `<label class="row" style="gap:6px">persone <input type="number" min="0" max="${NMAX}" step="1" data-fid="n-${key}" data-act="dishN" data-ev="${e.id}" data-i="${esc(dk(d, i))}" value="${dd.N}" aria-label="Persone per ${esc(d.label)}"></label>

  else if (act === 'copy') {
    const txt = JSON.stringify({mode: S.mode, buffer: S.buffer, ev: S.ev, ver: S.ver});
    const done = ok => { t.textContent = ok ? 'Copiato! Incolla in chat' : 'Copia a mano il testo qui sotto'; if (!ok) { let ta = document.getElementById('cpbox'); if (!ta) { ta = document.createElement('textarea'); ta.id = 'cpbox'; ta.style.cssText = 'width:100%;height:120px;margin-top:8px'; t.parentNode.appendChild(ta); } ta.value = txt; ta.select(); } };
    try { navigator.clipboard.writeText(txt).then(() => done(true), () => done(false)); } catch (e) { done(false); }
    return;
  }
  else if (act === 'resetev') {   // due tocchi: la prima volta chiede conferma; la versione precedente resta nello storico
    if (!S.ui['rst-' + id]) { S.ui['rst-' + id] = true; render(); return; }
    S.ui['rst-' + id] = false; delete S.ev[id]; restoreNote[id] = 'azzerato da Max'; evState(e);
  }
  else if (act === 'ack') { evState(e).mh = e.menu_hash; }
  else if (act === 'history') { if (hist && hist.key === id) { hist = null; render(); return; } hist = {key: id, loading: true}; render(); API.call('cc_history', {key: id}).then(r => { hist = {key: id, versions: r.versions}; render(); }).catch(() => { hist = null; render(); }); return; }
  else if (act === 'restore') { const v = hist && hist.versions.find(x => x.ver === +t.dataset.v); if (!v) return; S.ev[id] = JSON.parse(JSON.stringify(v.state)); restoreNote[id] = 'ripristinata la versione ' + v.ver; hist = null; }
  else if (act === 'import') { t.disabled = true; API.call('cc_import', {data: local}).then(() => { try { localStorage.setItem(LOCAL_KEY + '-importato', JSON.stringify(local)); localStorage.removeItem(LOCAL_KEY); } catch (e) {} location.reload(); }).catch(() => { t.disabled = false; t.textContent = 'Non è andata: riprova'; }); return; }
  else if (act === 'keepmine') { S.ver[t.dataset.id] = conflicts[t.dataset.id]; delete conflicts[t.dataset.id]; dirty.add(t.dataset.id); sync = {state: 'saving'}; flush(); render(); return; }
  else if (act === 'reloadsrv') { location.reload(); return; }
  else if (act === 'open') S.ui[t.dataset.key] = !S.ui[t.dataset.key];
  else if (act === 'guestsrc') evState(e).guests = +t.dataset.n;
  else if (act === 'clone') {
    const src = evById('freedom29'); e.dishes = JSON.parse(JSON.stringify(src.dishes)); const es = evState(e); es.clone = true;
    e.fonti = e.fonti.slice(); e.guests = 0; es.guests = 0;
  }
  else if (act === 'addtab') { const u = ui(id); u.tab = t.dataset.t; u.q = ''; u.sel = null; u.qty = ''; u.unit = 'g'; }
  else if (act === 'addpick') {
    const u = ui(id); u.sel = t.dataset.id;
    if (u.tab === 'ing') { const g = INGBY[u.sel]; u.unit = g.pg != null ? 'g' : g.pm != null ? 'ml' : g.pe != null ? 'pz' : 'g'; }
    else {
      const r = RECBY[u.sel];
      if (r && r.lazy) { u.loading = true; API.call('cc_recipe', {id: u.sel}).then(x => { const i = D.rec.findIndex(y => y.id === u.sel); if (i >= 0) D.rec[i] = x.rec; RECBY[u.sel] = x.rec; u.loading = false; u.unit = x.rec.cpp != null ? 'porz.' : (x.rec.cpu != null ? x.rec.cu : 'porz.'); render(); }).catch(() => { u.loading = false; u.sel = null; render(); }); }
      else u.unit = r.cpp != null ? 'porz.' : (r.cpu != null ? r.cu : 'porz.');
    }
  }
  else if (act === 'addgo') {
    const u = ui(id), es = evState(e); if (!u.sel || !(+u.qty > 0)) return;
    const ref = u.tab === 'ing' ? INGBY[u.sel] : RECBY[u.sel];
    es.extras.push({type: u.tab, refId: u.sel, name: ref.n || ref.t, qty: +u.qty, unit: u.unit || 'porz.'});
    u.sel = null; u.q = ''; u.qty = '';
  }
  else if (act === 'xdel') evState(e).extras.splice(+t.dataset.k, 1);
  else return;
  if (['mode'].includes(act)) save('_prefs'); else if (['guestsrc', 'clone', 'addgo', 'xdel', 'resetev', 'ack', 'restore'].includes(act)) save(id);
  render();
});
document.addEventListener('input', ev => {
  const t = ev.target; const act = t.dataset && t.dataset.act; if (!act) return;
  if (act === 'cancelled') { S.ui.cancelled = t.checked; render(); return; }
  if (act === 'buf') { S.buffer = t.checked; save('_prefs'); render(); return; }
  const id = t.dataset.ev, e = id && evById(id); if (!e) return;
  const es = evState(e);
  const num = v => v === '' ? null : Math.max(0, +v);
  if (act === 'guests') es.guests = Math.min(NMAX, num(t.value) || 0);
  else if (act === 'mp') es.mp = num(t.value) || 0;
  else if (act === 'mq') es.mq = num(t.value) || 0;
  else if (act === 'dishN') dState(es, t.dataset.i).N = num(t.value) == null ? null : Math.min(NMAX, num(t.value));
  else if (act === 'man') dState(es, t.dataset.i).man[t.dataset.r] = num(t.value) || 0;
  else if (act === 'ovr') { const v = t.value; if (v === '') delete es.ovr[t.dataset.k]; else es.ovr[t.dataset.k] = v; }
  else if (act === 'xprice') { es.extras[+t.dataset.k].price = t.value === '' ? null : t.value; }
  else if (act === 'addq') { const u = ui(id); u.q = t.value; u.sel = null; }
  else if (act === 'addqty') { ui(id).qty = t.value; }
  else if (act === 'addunit') { ui(id).unit = t.value; }
  else return;
  if (!['addq', 'addqty', 'addunit'].includes(act)) save(id);
  clearTimeout(window._rt); window._rt = setTimeout(render, 450);   // aspetta che finisci di scrivere: così il cursore non salta
});
// ripristina il menu copiato per Freedom 09/30 se l'avevi scelto
D.events.forEach(e => { const es = S.ev[e.id]; if (es && es.clone && !e.dishes.length) e.dishes = JSON.parse(JSON.stringify(evById('freedom29').dishes)); });
render();
}
boot();
