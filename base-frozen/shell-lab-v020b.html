<title>Shell Lab V020-B</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&display=swap">
<style>
/* Layout: fixed shell — tab strip on top, one big scrolling column, four worlds at the thumb. */
:root{
  --bg:#f2f5fa; --surf:#ffffff; --surf2:#e8eef7; --line:#d9e1ee;
  --tx:#14233b; --tx2:#4a5d7a; --txm:#7b8ba3;
  --today:#1d4ed8; --rest:#0f766e; --cat:#7c3aed; --plan:#b45309;
  --ok:#15803d; --ok-bg:#e6f4ea; --warn:#c2410c; --warn-bg:#fdeee6;
  --shadow:0 1px 2px rgba(20,35,59,.06),0 4px 14px rgba(20,35,59,.06);
  --fd:'Archivo',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
  --fb:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',Arial,sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1420; --surf:#172131; --surf2:#1f2b3e; --line:#2a3850;
  --tx:#eef2f8; --tx2:#b3c0d4; --txm:#7f8ea6;
  --today:#6d95ff; --rest:#2dd4bf; --cat:#a78bfa; --plan:#f59e0b;
  --ok:#4ade80; --ok-bg:#12301f; --warn:#fb923c; --warn-bg:#3a1f12;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0d1420; --surf:#172131; --surf2:#1f2b3e; --line:#2a3850;
  --tx:#eef2f8; --tx2:#b3c0d4; --txm:#7f8ea6;
  --today:#6d95ff; --rest:#2dd4bf; --cat:#a78bfa; --plan:#f59e0b;
  --ok:#4ade80; --ok-bg:#12301f; --warn:#fb923c; --warn-bg:#3a1f12;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:var(--fb);font-size:17px;line-height:1.35;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:focus-visible{outline:3px solid var(--today);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* top: lab label + tabs */
#top{position:fixed;left:0;right:0;top:0;z-index:20;background:var(--bg);padding-top:var(--sat);border-bottom:1px solid var(--line)}
.lab{display:flex;justify-content:space-between;align-items:center;padding:6px 16px 0;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--txm)}
.lab b{color:var(--tx2)}
#tabs{display:flex;gap:8px;overflow-x:auto;padding:8px 16px 10px;scrollbar-width:none;scroll-snap-type:x proximity}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:flex;align-items:center;gap:8px;height:48px;padding:0 6px 0 14px;border-radius:14px;background:var(--surf);border:1.5px solid var(--line);font-weight:650;font-size:16px;max-width:240px;scroll-snap-align:start}
.tab .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.tab.on{border-color:var(--c,var(--today));box-shadow:0 0 0 1.5px var(--c,var(--today)) inset;background:var(--surf)}
.tab.home{padding-right:14px}
.tab .x{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--txm);font-size:20px;flex:0 0 auto}
.tab .x:active{background:var(--surf2)}
.tab.plus{padding:0;width:48px;justify-content:center;font-size:26px;color:var(--tx2)}

/* main */
#main{position:fixed;left:0;right:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.page{padding:18px 16px 40px;max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

/* bottom worlds */
#worlds{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surf);border-top:1px solid var(--line);padding:6px 8px calc(6px + var(--sab));display:grid;grid-template-columns:1fr 1fr 1.1fr 1fr 1fr;gap:2px;align-items:end}
.w.ask{color:var(--tx)}
.w.ask .orb{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;background:var(--tx);color:var(--bg);margin-top:-22px;box-shadow:0 6px 18px rgba(20,35,59,.25)}
.w.ask .orb svg{width:28px;height:28px}
.w{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;border-radius:14px;font-size:13px;font-weight:700;color:var(--txm)}
.w svg{width:28px;height:28px}
.w.on{color:var(--c);background:var(--surf2)}

/* type */
.eyebrow{font-size:13px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--txm)}
h1{font-family:var(--fd);font-size:34px;line-height:1.05;margin:0;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
h2{font-family:var(--fd);font-size:15px;margin:0 0 10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--txm)}
.sub{color:var(--tx2);font-size:18px;margin-top:6px}
.back{display:flex;align-items:center;gap:6px;height:44px;color:var(--c,var(--today));font-weight:700;font-size:17px;margin:-8px 0 -10px}
.back svg{width:22px;height:22px}

/* blocks */
.card{background:var(--surf);border-radius:20px;box-shadow:var(--shadow);border:1px solid var(--line)}
.list{background:var(--surf);border-radius:20px;border:1px solid var(--line);overflow:hidden}
.row{display:flex;align-items:center;gap:14px;width:100%;min-height:68px;padding:12px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row:active,.big:active,.hero:active,.day:active{filter:brightness(.96)}
.row .main{flex:1;min-width:0}
.row .name{font-size:19px;font-weight:650}
.row .meta{font-size:15px;color:var(--tx2);margin-top:2px}
.row .qty{font-family:var(--fd);font-weight:800;font-size:24px;white-space:nowrap}
.chev{color:var(--txm);font-size:24px;flex:0 0 auto}
.check{width:44px;height:44px;border-radius:50%;border:2.5px solid var(--line);flex:0 0 auto;display:grid;place-items:center}
.check.on{background:var(--ok);border-color:var(--ok);color:#fff}
.check svg{width:22px;height:22px}
.row.done .name,.row.done .qty{color:var(--txm);text-decoration:line-through;text-decoration-thickness:2px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--surf2);color:var(--tx2);white-space:nowrap}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.cat{background:color-mix(in srgb,var(--cat) 14%,transparent);color:var(--cat)}
.pill.rest{background:color-mix(in srgb,var(--rest) 14%,transparent);color:var(--rest)}

/* clean pass: color only for world, attention, done */
.ctx{color:var(--cat);font-weight:650}
.wtx{color:var(--warn);font-weight:700}
.muted{color:var(--txm)}
.dotw{width:12px;height:12px;border-radius:50%;background:var(--warn);flex:0 0 auto}
.dotc{width:12px;height:12px;border-radius:50%;background:var(--cat);flex:0 0 auto}
.dec{padding:16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.dec:first-child{border-top:0}
.dec .name{font-size:19px;font-weight:700}
.dec .meta{font-size:15px;color:var(--tx2)}
.dec .q{font-size:17px}
.dec .links{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.lnk{color:var(--today);font-weight:700;min-height:44px;display:inline-flex;align-items:center}
.right{font-size:15px;white-space:nowrap;flex:0 0 auto}
#tabs[hidden]{display:none}
.day{box-shadow:none}
.lab a{text-decoration:none;font-weight:700;letter-spacing:.04em}
/* combined qty split */
.split{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.bar{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:8px;background:var(--surf2)}
.bar i{display:block}

/* hero */
.hero{display:block;width:100%;padding:20px;border-radius:24px;background:var(--c);color:#fff;box-shadow:var(--shadow)}
.hero .k{font-size:14px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;opacity:.85}
.hero .t{font-family:var(--fd);font-weight:800;font-size:30px;line-height:1.1;margin-top:6px}
.hero .m{font-size:18px;margin-top:6px;opacity:.95}
.hero .go{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.3);font-weight:700;font-size:18px}
.hero .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.hero .chips span{background:rgba(255,255,255,.2);padding:5px 12px;border-radius:999px;font-weight:700;font-size:15px}

/* big tiles */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big{display:flex;flex-direction:column;justify-content:space-between;gap:18px;min-height:132px;padding:18px;border-radius:22px;background:var(--surf);border:1px solid var(--line);box-shadow:var(--shadow)}
.big .lbl{font-family:var(--fd);font-weight:800;font-size:23px;line-height:1.1}
.big .val{font-size:16px;color:var(--tx2)}
.big .val b{color:var(--tx);font-size:20px}
.big.alert .val b{color:var(--warn)}
.big svg{width:30px;height:30px;color:var(--c)}

/* segmented */
.seg{display:flex;gap:6px;background:var(--surf2);padding:5px;border-radius:16px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:1 0 auto;height:46px;border-radius:12px;font-weight:700;font-size:16px;text-align:center;padding:0 12px;color:var(--tx2)}
.seg button.on{background:var(--surf);color:var(--tx);box-shadow:var(--shadow)}

/* ring */
.ring{display:flex;align-items:center;gap:16px;padding:16px}
.ring svg{width:68px;height:68px;flex:0 0 auto}
.ring .big1{font-family:var(--fd);font-weight:800;font-size:26px}

/* note / banner */
.note{padding:14px 16px;border-radius:16px;background:var(--surf2);color:var(--tx2);font-size:16px}
.banner{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;background:color-mix(in srgb,var(--c) 12%,var(--surf));border:1.5px solid color-mix(in srgb,var(--c) 40%,transparent)}
.banner .main{flex:1;min-width:0}
.banner b{font-size:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border-radius:14px;font-weight:750;font-size:16px;background:var(--c,var(--today));color:#fff;text-align:center}
.btn.ghost{background:var(--surf);color:var(--c,var(--today));border:1.5px solid currentColor}
.fix{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:18px;background:var(--warn-bg);color:var(--tx)}
.fix .h{font-weight:800;color:var(--warn);font-size:17px}

/* planner */
.week{display:flex;flex-direction:column;gap:10px}
.day{display:flex;gap:16px;align-items:stretch;width:100%;padding:14px 16px;border-radius:20px;background:var(--surf);border:1px solid var(--line);box-shadow:var(--shadow)}
.day .d{width:58px;flex:0 0 auto;text-align:center}
.day .d .dn{font-size:14px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--txm)}
.day .d .dd{font-family:var(--fd);font-weight:800;font-size:38px;line-height:1}
.day .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;justify-content:center}
.day .ev{font-weight:750;font-size:18px;color:var(--cat)}
.day .sum{font-size:15px;color:var(--tx2)}
.day.today{border:2.5px solid var(--plan)}
.day.today .dd,.day.today .dn{color:var(--plan)}
.day.past{opacity:.5}
.day.closed .sum{font-style:italic}
.wk{display:flex;justify-content:space-between;align-items:center}
.wk button{height:44px;padding:0 14px;border-radius:12px;background:var(--surf);border:1px solid var(--line);font-weight:700;color:var(--plan)}

/* ingredients/steps */
.ing{display:flex;justify-content:space-between;gap:12px;padding:14px 16px;border-top:1px solid var(--line);font-size:18px}
.ing:first-child{border-top:0}
.ing b{font-family:var(--fd);font-size:20px;white-space:nowrap}
.step{display:flex;gap:14px;padding:14px 16px;border-top:1px solid var(--line);font-size:18px}
.step:first-child{border-top:0}
.step .n{font-family:var(--fd);font-weight:800;font-size:20px;color:var(--c);width:24px;flex:0 0 auto}
.qbtns{display:flex;gap:8px;flex-wrap:wrap}
.qbtns button{min-height:52px;padding:6px 14px;border-radius:14px;background:var(--surf);border:1.5px solid var(--line);font-weight:700;font-size:15px;text-align:center;line-height:1.15}
.qbtns button b{display:block;font-family:var(--fd);font-size:19px}
.qbtns button.on{border-color:var(--c);color:var(--c);box-shadow:0 0 0 1.5px var(--c) inset}

/* sheet */
#scrim{position:fixed;inset:0;background:rgba(10,18,30,.45);z-index:40}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:24px 24px 0 0;max-height:82%;overflow-y:auto;padding:10px 16px calc(24px + var(--sab))}
#sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 14px}
#sheet .page{padding:0}
@media (prefers-reduced-motion:no-preference){#sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(40px);opacity:.6}}}
.toast{position:fixed;left:16px;right:16px;z-index:50;background:var(--tx);color:var(--bg);padding:10px 10px 10px 18px;border-radius:16px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:12px;min-height:56px;max-width:560px;margin:0 auto}
.toast span{flex:1;min-width:0}
.toast button{color:var(--bg);border:1.5px solid currentColor;border-radius:12px;padding:0 16px;height:44px;font-weight:800}
/* narrative today */
.greet h1{font-size:36px}
.brief{font-size:20px;line-height:1.4;color:var(--tx2);margin-top:10px;text-wrap:pretty}
.brief b{color:var(--tx)}
.chap{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 10px}
.chap h2{margin:0}
.chap span{font-size:15px;color:var(--txm);font-weight:600}
.row.donebg{background:var(--ok-bg)}
.defer{padding:16px;border-radius:20px;background:var(--surf2);display:flex;flex-direction:column;gap:12px}
.defer .name{font-size:19px;font-weight:700}
.defer p{margin:0;color:var(--tx2);font-size:16px}
.decide{display:flex;align-items:center;gap:14px;width:100%;padding:16px;border-radius:20px;background:var(--warn-bg);border:1px solid color-mix(in srgb,var(--warn) 25%,transparent)}
.decide .main{flex:1;min-width:0}
.decide .name{font-size:19px;font-weight:700}
.decide .meta{font-size:15px;color:var(--tx2)}
.feed{display:flex;flex-direction:column}
.feed div{display:flex;gap:14px;padding:9px 2px;font-size:16px;color:var(--tx2);border-top:1px solid var(--line)}
.feed div:first-child{border-top:0}
.feed time{font-variant-numeric:tabular-nums;color:var(--txm);width:46px;flex:0 0 auto;font-weight:600}
.feed .later{color:var(--txm);font-style:italic}
.feed .mine{color:var(--tx);font-weight:600}
/* ask */
.askin{width:100%;height:58px;border-radius:16px;border:2px solid var(--line);background:var(--surf);color:var(--tx);font:inherit;font-size:19px;padding:0 16px}
.askin:focus{outline:none;border-color:var(--today)}
.chips{display:flex;flex-direction:column;gap:8px}
.chips button{min-height:52px;padding:10px 16px;border-radius:14px;background:var(--surf);border:1px solid var(--line);font-size:17px;font-weight:600;color:var(--tx)}
.chips button i{font-style:normal;color:var(--txm);font-weight:500;font-size:14px;display:block}
.preview{padding:18px;border-radius:20px;background:var(--surf);border:2px solid var(--today);display:flex;flex-direction:column;gap:12px}
.preview .k{font-size:13px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--today)}
.preview .t{font-family:var(--fd);font-weight:800;font-size:26px;line-height:1.1}
.preview .acts{display:flex;gap:10px}
.preview .acts .btn{flex:1}
.answer{padding:18px;border-radius:20px;background:var(--surf);border:1px solid var(--line);font-size:18px;line-height:1.45;display:flex;flex-direction:column;gap:12px}
.why{color:var(--today);font-weight:700;font-size:16px;min-height:44px;display:inline-flex;align-items:center}
</style>

</div>

  return sorted.map(f=>`<div class="${f.later?'later':''} ${f.mine?'mine':''}"><time>${f.t}</time><span>${esc(f.x)}</span></div>`).join('');
}

SCREENS.decisions = {title:()=>'Decisions', c:'--today', render(p){
  const scope = p.scope||'all';
  const all = decisionsFor(scope), open = all.filter(decOpen), closed = all.filter(d=>!decOpen(d));
  const lbl = scope==='all' ? 'Catering · all upcoming' : scope==='today' ? 'Today · Friday 9' : `Planner · ${WEEKS.flat().find(x=>x.dd==scope).dn} ${scope}`;
  const item = d => {
    if(d.kind==='check'){ const c=CHECKS[d.id];
      return `<div class="dec"><div><div class="name">${esc(c.title)}</div><div class="meta">For ${EVENTS[d.ev].name} · tonight</div></div><div class="q">${esc(c.q)}</div>
        <button class="btn" style="--c:var(--warn)" data-a="fix" data-k="${d.id}">${esc(c.fix)}</button>
        <div class="links"><button class="lnk" data-a="openRecipe" data-r="${c.recipe}" data-from="event:${d.ev}">Open ${esc(RECIPES[c.recipe].name)} ›</button></div></div>`; }
    const e = EVENTS[d.ev];
    return `<div class="dec"><div><div class="name">${esc(e.name)} menu</div><div class="meta">Draft from Tripleseat · ${esc(e.short)} · ${e.guests} guests</div></div><div class="q">Confirm the menu once. Then prep, shopping and cost are planned from it.</div>
      <button class="btn" style="--c:var(--warn)" data-a="openEvent" data-id="${d.ev}">Review menu</button></div>`;
  };
  return `<div class="page" style="--c:var(--today)">${backBtn()}
    <div><div class="eyebrow">${lbl}</div><h1>${open.length?plural(open.length,'decision'):'Nothing to decide'}</h1></div>
    ${open.length?`<div class="list">${open.map(item).join('')}</div>`:'<p class="note">All clear. Every count in the app is already updated.</p>'}
    ${closed.length?`<section><h2>Decided</h2><div class="list">${closed.map(d=>`<div class="row done"><span class="main"><div class="name">${esc(decTitle(d))}</div></span></div>`).join('')}</div></section>`:''}

}};

/* ---- EVENT (own tab) ---- */
SCREENS.event = {title:p=>EVENTS[p.id].name, c:'--cat', render(p){
  const e = EVENTS[p.id], s = evStatus(p.id), seg = p.seg||'plan';
  const segs = [['plan','Plan'],['production','Production'],['shopping','Shopping'],['cost','Cost']];
  let body='';
  if(seg==='plan'){
    const items = e.menu.map(m=>{
      const open = m.check && !S.fixed[m.check];
      const right = open ? '<span class="right wtx">Decide</span>' : '';
      return m.r?`<button class="row" data-a="openRecipe" data-r="${m.r}" data-from="event:${p.id}"><span class="main"><div class="name">${esc(m.n)}</div><div class="meta">${esc(m.q)}${open?' · '+esc(CHECKS[m.check].q.split(':')[0].replace(/\?$/,'')):''}</div></span>${right}<span class="chev">›</span></button>`
                :`<div class="row"><span class="main"><div class="name">${esc(m.n)}</div><div class="meta">${esc(m.q)}</div></span></div>`;
    }).join('');
    body = s.draft
      ? `<p class="note">Imported from Tripleseat. Check the dishes once, then confirm. Prep, shopping and cost are planned from this menu.</p><div class="list">${items}</div><button class="btn" style="--c:var(--warn)" data-a="review" data-id="${p.id}">Confirm menu</button>`
      : `<div class="sub" style="margin:0"><b style="color:var(--tx)">${s.ready} of ${s.total} ready</b>${s.checks?` · <span class="wtx">${s.checks} to decide</span>`:''}</div><div class="list">${items}</div>`;
  } else if(seg==='production'){
    body = e.production.length ? e.production.map(b=>`<section><h2>${b.when}</h2><div class="list">${b.items.map(([t,st])=>{
      const chk = st.startsWith('check:') ? st.slice(6) : null;
      const right = st==='done'?'<span class="right muted">Done</span>': chk && !S.fixed[chk] ? '<span class="right wtx">Waits for decision</span>' : '';
      return `<div class="row ${st==='done'?'done':''}"><span class="main"><div class="name">${esc(t)}</div></span>${right}</div>`;}).join('')}</div></section>`).join('')
      : `<p class="note">Planned after the menu is confirmed.</p>`;
  } else if(seg==='shopping'){
    const g = (st,h)=>{ const l=e.shopping.filter(x=>x.st===st); return l.length?`<section><h2>${h}</h2><div class="list">${l.map(shopRow).join('')}</div></section>`:''; };
    body = e.shopping.length ? g('buy','To buy')+g('coming','Arriving')+g('have','In house') : `<p class="note">Planned after the menu is confirmed.</p>`;
  } else {
    if(!e.cost) body = `<p class="note">Calculated after the menu is confirmed.</p>`;
    else {
      const rev = e.price*e.guests, miss = e.cost.missing.filter(k=>!S.fixed[k]);
      const lo = Math.round((e.cost.costed + (miss.length?e.cost.est[0]:118))/rev*100), hi = Math.round((e.cost.costed + (miss.length?e.cost.est[1]:118))/rev*100);
      body = `<div class="grid"><div class="big"><div class="lbl num">$${rev.toLocaleString('en-US')}</div><div class="val">$${e.price} × ${e.guests} guests</div></div>
        <div class="big"><div class="lbl num">${miss.length?`${lo}–${hi}%`:`${hi}%`}</div><div class="val">food cost${miss.length?' · range':''}</div></div></div>
        ${miss.length?`<div class="list">${miss.map(k=>`<button class="row" data-a="openRecipe" data-r="${k}" data-from="event:${p.id}"><span class="dotw"></span><span class="main"><div class="name">${RECIPES[k].name} has no catering cost</div><div class="meta">Decide it and the range becomes one number</div></span><span class="chev">›</span></button>`).join('')}</div>`:''}`;
    }
  }
  return `<div class="page" style="--c:var(--cat)">
    ${backBtn()}
    <div><div class="eyebrow">${esc(e.day)} · ${e.time}</div><h1>${esc(e.name)}</h1><div class="sub">${e.guests} guests · ${esc(e.where)}</div>
      <div class="meta muted" style="margin-top:6px;font-size:15px">From ${esc(e.src)}${s.draft?' · <span class="wtx">menu not confirmed</span>':''}</div></div>
    <div class="seg" role="tablist">${segs.map(([k,l])=>`<button class="${seg===k?'on':''}" data-a="seg" data-k="${k}">${l}</button>`).join('')}</div>
    ${body}
  </div>`;
}};

SCREENS.recipe = {title:p=>RECIPES[p.id].name, c:'--rest', render(p){
  const r = RECIPES[p.id];
  // quantity options from every context that wants this recipe
  const opts = [{k:'batch', l:r.batchLabel, v:r.base}];
  const tp = TODAY_PREP.find(x=>x.r===p.id);
  if(tp){ const q=prepQty(tp); if(q.R) opts.push({k:'rest', l:'Restaurant', v:q.R, u:tp.unit}); if(q.R && q.C) opts.push({k:'today', l:'Today total', v:q.T, u:tp.unit}); }
  let fromEv = p.from && p.from.startsWith('event:') ? p.from.slice(6) : (tp && tp.ev && tp.C ? tp.ev : null);
  if(fromEv){ const mi = EVENTS[fromEv].menu.find(m=>m.r===p.id); if(mi && mi.tq) opts.push({k:'event', l:EVENTS[fromEv].name.split(' ')[0], v:mi.tq, u:r.unit==='hotel pan'?'pans':r.unit}); }
  let mode = p.mode || (p.from==='today' && tp && tp.C ? (tp.R?'today':'event') : p.from && p.from.startsWith('event:') ? 'event' : 'batch');
  if(!opts.find(o=>o.k===mode)) mode = 'batch';
  const sel = opts.find(o=>o.k===mode);
  const f = sel.v / r.base;
  const chk = r.check && !S.fixed[r.check] ? CHECKS[r.check] : null;
  const fixedNow = r.check && S.fixed[r.check] ? CHECKS[r.check] : null;
  const evBanner = '';
  return `<div class="page" style="--c:var(--rest)">
    ${backBtn()}
    ${evBanner}
    <div><div class="eyebrow">${esc(r.station)} · ${esc(r.time)}</div><h1>${esc(r.name)}</h1></div>
    ${chk?`<div class="fix"><div class="h">Chef decides · ${esc(chk.title)}</div><div>${esc(chk.q)}</div><button class="btn" style="--c:var(--warn)" data-a="fix" data-k="${r.check}">${esc(chk.fix)}</button><div style="font-size:14px;color:var(--tx2)">Demo: this only changes the prototype.</div></div>`:''}
    ${fixedNow?`<p class="note">Decided: ${esc(fixedNow.fix.replace('Confirm ',''))}. ${esc(fixedNow.after)}.</p>`:''}
    ${tp?`<button class="why" data-a="why" data-id="${tp.id}">Why ${fmt(prepQty(tp).T)} ${esc(tp.unit)} today?</button>`:''}
    <section><h2>How much</h2><div class="qbtns">${opts.map(o=>`<button class="${o.k===mode?'on':''}" data-a="mode" data-k="${o.k}">${esc(o.l)}<b class="num">${fmt(o.v)} ${esc(o.u||r.unit)}</b></button>`).join('')}</div></section>
    <section><h2>Ingredients · for ${fmt(sel.v)} ${esc(sel.u||r.unit)}</h2><div class="list">${r.ing.map(([n,q,u,id])=>`<${id?`button data-a="openIng" data-id="${id}"`:'div'} class="ing" style="width:100%"><span>${esc(n)}</span><b class="num">${scaleFmt(q,u,f)}</b></${id?'button':'div'}>`).join('')}</div></section>
    <section><h2>Method</h2><div class="list">${r.steps.map((s,i)=>`<div class="step"><span class="n">${i+1}</span><span>${esc(s)}</span></div>`).join('')}</div></section>
  </div>`;
}};

/* ---- PLANNER · a map of time; details open from summaries ---- */
function dayPrep(d){
  if(d.today) return TODAY_PREP.filter(p=>!isDeferred(p)).map(p=>{const q=prepQty(p); return P(p.name,q.R,q.C,p.unit,p.r);});
  return d.prep||[];
}
const findDay = (w,dd) => WEEKS[w].find(x=>x.dd==dd);
SCREENS.planner = {title:()=>'Planner', c:'--plan', render(p){
  const wi = p.w||0, wk = WEEKS[wi];
  const day = d => {
    const e = d.ev ? EVENTS[d.ev] : null, pr = dayPrep(d), extra = pr.filter(x=>x.C).length;
    const parts = [];
    if(pr.length) parts.push(plural(pr.length,'prep')+(extra?` (${extra} catering)`:''));
    if(d.buy) parts.push(`${d.buy.length} buy`);
    const dec = decisionsFor(d.dd).filter(decOpen);
    return `<button class="day ${d.today?'today':''} ${d.past?'past':''} ${d.closed?'closed':''}" data-a="go" data-s="day" data-w="${wi}" data-d="${d.dd}">
      <div class="d"><div class="dn">${d.dn}</div><div class="dd num">${d.dd}</div></div>
      <div class="body">${e?`<div class="ev">${e.name} · ${e.guests}</div>`:''}
        <div class="sum">${d.closed?'Closed':parts.join(' · ')}</div>
        ${dec.length && !d.past?`<div class="wtx" style="font-size:15px">${plural(dec.length,'decision')}</div>`:''}</div>
      <span class="chev" style="align-self:center">›</span></button>`;
  };
  return `<div class="page" style="--c:var(--plan)">
    <div><div class="eyebrow">October 2026</div><h1>${wi?'Next week':'This week'}</h1></div>
    <div class="wk"><button data-a="week" data-w="0" ${wi===0?'disabled style="opacity:.4"':''}>‹ This week</button><span class="eyebrow">${wi?'12 – 18 Oct':'5 – 11 Oct'}</span><button data-a="week" data-w="1" ${wi===1?'disabled style="opacity:.4"':''}>Next ›</button></div>
    <div class="week">${wk.map(day).join('')}</div>
  </div>`;
}};
SCREENS.day = {title:p=>{const d=findDay(p.w,p.d); return `${d.dn} ${d.dd}`;}, c:'--plan', render(p){
  const d = findDay(p.w,p.d);
  const full = {Mon:'Monday',Tue:'Tuesday',Wed:'Wednesday',Thu:'Thursday',Fri:'Friday',Sat:'Saturday',Sun:'Sunday'}[d.dn];
  const pr = dayPrep(d), e = d.ev ? EVENTS[d.ev] : null, dec = decisionsFor(d.dd).filter(decOpen);
  const q = x => `${x.n.replace(' sauce','')} ${fmt(x.R+x.C)}${x.u==='kg'||x.u==='L'?' '+x.u:''}`;
  const prepAct = d.today ? `data-a="world" data-w="today"` : `data-a="go" data-s="daylist" data-w="${p.w}" data-d="${d.dd}" data-k="prep"`;
  return `<div class="page" style="--c:var(--plan)">${backBtn()}
    <div><div class="eyebrow">${d.today?'Today · ':''}October 2026</div><h1 style="font-size:44px">${full} ${d.dd}</h1></div>
    ${d.closed?'<p class="note">Restaurant closed.</p>':`<div class="list">
      ${dec.length?`<button class="row" data-a="go" data-s="decisions" data-scope="${d.dd}"><span class="dotw"></span><span class="main"><div class="name">${plural(dec.length,'decision')}</div><div class="meta">${dec.map(decTitle).join(' · ')}</div></span><span class="chev">›</span></button>`:''}
      ${e?`<button class="row" data-a="openEvent" data-id="${d.ev}"><span class="dotc"></span><span class="main"><div class="name">${e.name}</div><div class="meta">${e.guests} guests · ${e.time}</div></span><span class="chev">›</span></button>`:''}
      ${pr.length?`<button class="row" ${prepAct}><span class="main"><div class="name">${plural(pr.length,'prep')}</div><div class="meta">${pr.slice(0,3).map(q).join(' · ')}${pr.length>3?` · +${pr.length-3} more`:''}${pr.some(x=>x.C)?` · <span class="ctx">catering included</span>`:''}</div></span><span class="chev">›</span></button>`:''}
      ${d.buy?`<button class="row" data-a="go" data-s="daylist" data-w="${p.w}" data-d="${d.dd}" data-k="buy"><span class="main"><div class="name">Buy & deliveries · ${d.buy.length}</div><div class="meta">${d.buy.map(b=>b[0]).join(' · ')}</div></span><span class="chev">›</span></button>`:''}
    </div>`}
    ${d.today?`<p class="note">Prep for today opens in Today, where you check it off.</p>`:''}
  </div>`;
}};
SCREENS.daylist = {title:p=>{const d=findDay(p.w,p.d); return `${p.k==='buy'?'Buy':'Prep'} · ${d.dn} ${d.dd}`;}, c:'--plan', render(p){
  const d = findDay(p.w,p.d), ev = d.cev ? EVENTS[d.cev].name.split(' ')[0] : '';
  const rows = p.k==='buy'
    ? d.buy.map(([t,ing])=> ing?`<button class="row" data-a="openIng" data-id="${ing}"><span class="main"><div class="name">${esc(t)}</div></span><span class="chev">›</span></button>`:`<div class="row"><span class="main"><div class="name">${esc(t)}</div></span></div>`).join('')
    : dayPrep(d).map(x=>{ const meta = x.R&&x.C?`${fmt(x.R)} restaurant <span class="ctx">+ ${fmt(x.C)} ${ev}</span>`: x.C?`<span class="ctx">All for ${ev}</span>`:'Restaurant';
        const inner = `<span class="main"><div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline"><span class="name">${esc(x.n)}</span><span class="qty num">${fmt(x.R+x.C)} <small style="font-size:16px">${x.u}</small></span></div><div class="meta">${meta}</div></span>`;
        return x.r?`<button class="row" data-a="openRecipe" data-r="${x.r}" data-from="${d.cev?'event:'+d.cev:'restaurant'}">${inner}</button>`:`<div class="row">${inner}</div>`; }).join('');
  return `<div class="page" style="--c:var(--plan)">${backBtn()}<div><div class="eyebrow">Planner</div><h1>${p.k==='buy'?'Buy & deliveries':'Prep'}</h1><div class="sub">${({Mon:'Monday',Tue:'Tuesday',Wed:'Wednesday',Thu:'Thursday',Fri:'Friday',Sat:'Saturday',Sun:'Sunday'})[d.dn]} ${d.dd} October</div></div>
    <div class="list">${rows}</div></div>`;
}};

/* ============ RENDER ============ */
const $ = id => document.getElementById(id);
function cssVar(n){ return `var(${n})`; }
function renderTabs(){
  const el = $('tabs');
  el.hidden = !S.tabs.length;
  el.innerHTML = S.tabs.map(t=>{
    const e = t.stack[0], c = SCREENS[e.s].c;
    return `<div class="tab ${S.active===t.id?'on':''}" style="--c:${cssVar(c)}"><button style="display:flex;align-items:center;gap:8px;min-width:0;height:100%" data-a="tab" data-id="${t.id}"><span class="dot" style="background:${cssVar(c)}"></span><span class="t">${esc(titleOf(e))}</span></button><button class="x" data-a="close" data-id="${t.id}" aria-label="Close ${esc(titleOf(e))}">×</button></div>`;
  }).join('') + (S.tabs.length?`<button class="tab plus" data-a="plus" aria-label="Open something in a new tab">+</button>`:'');
  const on = el.querySelector('.tab.on'); if(on) on.scrollIntoView({inline:'nearest', block:'nearest'});
}
function renderWorlds(){
  const b = ([k,w])=>`<button class="w ${S.active==='home'&&S.world===k?'on':''}" style="--c:${cssVar(w.c)}" data-a="world" data-w="${k}">${ICON[k]}${w.label}</button>`;
  const e = Object.entries(WORLDS);
  $('worlds').innerHTML = b(e[0])+b(e[1])+`<button class="w ask" data-a="ask" aria-label="What do you need?"><span class="orb">${ICON.ask}</span>Need?</button>`+b(e[2])+b(e[3]);
}
function layout(){
  const t = $('top').offsetHeight, b = $('worlds').offsetHeight;
  $('main').style.top = t+'px'; $('main').style.bottom = b+'px';
}
function render(keepScroll){
  const e = cur();
  $('main').innerHTML = SCREENS[e.s].render(e.p||{});
  renderTabs(); renderWorlds(); layout();
  $('main').scrollTop = keepScroll ? $('main').scrollTop : (e.y||0);
  save();
}
let scT; $('main').addEventListener('scroll', ()=>{ clearTimeout(scT); scT=setTimeout(()=>{ cur().y = $('main').scrollTop; save(); },120); });
function rememberScroll(){ cur().y = $('main').scrollTop; }

/* ============ ACTIONS ============ */
function openTab(kind, ref, entry){
  rememberScroll();
  const origin = S.active==='home' ? {w:S.world, label:titleOf(cur())} : {tab:S.active, label:titleOf(tabById(S.active).stack[0])};
  let t = S.tabs.find(x=>x.kind===kind && x.ref===ref);
  if(t && t.id!==S.active) t.origin = origin;
  if(t){ if(entry.p.from) { const root=t.stack[0]; root.p.from = entry.p.from; delete root.p.mode; t.stack.length=1; } }
  else { t = {id:'t'+(S.seq++), kind, ref, stack:[entry], origin}; S.tabs.push(t); if(S.tabs.length>8) S.tabs.shift(); }
  S.active = t.id; render();
}
let undoFn=null, toastT;
function toast(msg, undo){
  document.querySelectorAll('.toast').forEach(t=>t.remove()); clearTimeout(toastT);
  const d=document.createElement('div'); d.className='toast'; d.setAttribute('role','status');
  d.innerHTML = `<span>${esc(msg)}</span>${undo?'<button data-a="undo">Undo</button>':''}`;
  d.style.bottom=($('worlds').offsetHeight+14)+'px'; document.body.appendChild(d);
  undoFn = undo||null; toastT=setTimeout(()=>{ d.remove(); undoFn=null; }, undo?5000:1800);
}
/* ---- What do you need? : Understand → Preview → Confirm → Execute → Update the plan ---- */
let pending=null;
function findPrep(t){ return TODAY_PREP.find(p=> t.includes(p.r) || t.includes(p.name.toLowerCase().split(' ')[0]) || (p.r==='tiramisu'&&t.includes('tiramis')) ); }
function ctxPrep(){ if(S.active==='home') return null; const t=tabById(S.active); return t && t.kind==='recipe' ? TODAY_PREP.find(p=>p.r===t.ref) : null; }
function interpret(raw){
  const t = raw.trim().toLowerCase(); if(!t) return '';
  const num = (t.match(/(\d+(?:[.,]\d+)?)/)||[])[1]; const n = num ? parseFloat(num.replace(',','.')) : null;
  let p = findPrep(t) || ((/\b(this|it|questo|full batch|all)\b/.test(t)) ? ctxPrep() : null);
  if(/^(why|perch)/.test(t)){
    if(!p) return `<div class="answer">Ask about a prep on today's list, for example “Why 5.5 kg arrabbiata?”</div>`;
    return `<div class="answer"><div class="eyebrow">Answer · nothing changes</div><div><b>${esc(p.name)} · ${fmt(prepQty(p).T)} ${p.unit}</b></div><div>${WHY[p.id]}</div><button class="btn" data-a="openRecipe" data-r="${p.r}" data-from="today">Open ${esc(p.name)}</button></div>`;
  }
  const tell = t.match(/^(tell|message|di a|dì a|scrivi a)\s+(\w+)[:,]?\s*(.*)$/);
  if(tell){
    const who = tell[2][0].toUpperCase()+tell[2].slice(1), msg = raw.trim().replace(/^\S+\s+(a\s+)?\S+[:,]?\s*/i,'') || '…';
    pending = {kind:'msg', who, msg};
    return preview('Message', `To ${who}`, `“${esc(msg)}”`, 'Send');
  }
  if(p && /(made|fatto|fatti|finished|done|only|solo|ho fatto|this|full)/.test(t)){
    const q = prepQty(p);
    if(n!==null && n < q.T){
      pending = {kind:'part', id:p.id, n};
      return preview('Record production', `${esc(p.name)} · ${fmt(n)} of ${fmt(q.T)} ${p.unit}`, `${fmt(q.T-n)} ${p.unit} still to make. They stay on Today.`, 'Record');
    }
    pending = {kind:'full', id:p.id};
    return preview('Record production', `${esc(p.name)} · ${fmt(q.T)} ${p.unit}`, q.R&&q.C?`${fmt(q.R)} restaurant + ${fmt(q.C)} ${EVENTS[p.ev].name.split(' ')[0]} · by Max · ${nowHM()}`:`by Max · ${nowHM()}`, 'Record');
  }
  // search
  const hits = [];
  Object.entries(EVENTS).forEach(([k,e])=>{ if(e.name.toLowerCase().includes(t)) hits.push(`<button class="row" data-a="openEvent" data-id="${k}"><span class="main"><div class="name">${e.name}</div><div class="meta">Event · ${e.short}</div></span><span class="chev">›</span></button>`); });
  TODAY_PREP.forEach(pp=>{ if(pp.name.toLowerCase().includes(t)) hits.push(`<button class="row" data-a="openRecipe" data-r="${pp.r}" data-from="today"><span class="main"><div class="name">${pp.name}</div><div class="meta">Today · ${fmt(prepQty(pp).T)} ${pp.unit}${S.done[pp.id]?' · done':''}</div></span><span class="chev">›</span></button>`); });
  Object.entries(RECIPES).forEach(([k,r])=>{ if(r.name.toLowerCase().includes(t)) hits.push(`<button class="row" data-a="openRecipe" data-r="${k}"><span class="main"><div class="name">${r.name}</div><div class="meta">Recipe · ${r.station}</div></span><span class="chev">›</span></button>`); });
  Object.entries(INGREDIENTS).forEach(([k,i])=>{ if(i.name.toLowerCase().includes(t)) hits.push(`<button class="row" data-a="openIng" data-id="${k}"><span class="main"><div class="name">${i.name}</div><div class="meta">Ingredient · ${i.onhand} on hand</div></span><span class="chev">›</span></button>`); });
  pending=null;
  return hits.length ? `<div class="list">${hits.slice(0,8).join('')}</div>` : `<div class="answer">Nothing found for “${esc(raw)}”. This demo knows today's prep, 8 recipes, 3 events and 6 ingredients.</div>`;
}
function preview(k, title, sub, verb){
  return `<div class="preview"><div class="k">${k} · check before saving</div><div class="t">${title}</div><div style="color:var(--tx2)">${sub}</div><div class="acts"><button class="btn ghost" data-a="askCancel">Cancel</button><button class="btn" data-a="askConfirm">${verb}</button></div></div>`;
}
function askRun(text){ const o=$('askout'); if(o) o.innerHTML = interpret(text); }
function execute(a){
  const p = a.id && TODAY_PREP.find(x=>x.id===a.id);
  if(a.kind==='full'){ const prev = {d:S.done[a.id], pt:S.part[a.id]}; S.done[a.id]=true; delete S.part[a.id]; log(`Max recorded ${p.name.toLowerCase()}, ${fmt(prepQty(p).T)} ${p.unit}`); render(true);
    toast(`${p.name} recorded`, ()=>{ S.done[a.id]=prev.d; if(prev.pt) S.part[a.id]=prev.pt; log(`Undone: ${p.name.toLowerCase()} back to open`); render(true); }); }
  if(a.kind==='part'){ const prev = S.part[a.id]; S.part[a.id]=a.n; log(`Max made ${fmt(a.n)} ${p.unit} ${p.name.toLowerCase()} · ${fmt(prepQty(p).left)} left`); render(true);
    toast(`${fmt(prepQty(p).left)} ${p.unit} ${p.name.toLowerCase()} left`, ()=>{ if(prev) S.part[a.id]=prev; else delete S.part[a.id]; log(`Undone: ${p.name.toLowerCase()} partial`); render(true); }); }
  if(a.kind==='msg'){ log(`Max to ${a.who}: “${a.msg}” (demo, not sent)`); render(true); toast(`Saved to the feed · demo, nothing sent`, ()=>{ log(`Undone: message to ${a.who}`); render(true); }); }
}
function goOrigin(t){
  const o = t && t.origin;
  if(o && o.tab && tabById(o.tab)) S.active = o.tab;
  else { S.active='home'; if(o && o.w) S.world=o.w; }
}
function sheet(html){ $('sheet').innerHTML = `<div class="grab"></div>${html}`; $('sheet').hidden=false; $('scrim').hidden=false; }
function closeSheet(){ $('sheet').hidden=true; $('scrim').hidden=true; }
$('scrim').onclick = closeSheet;

const A = {
  world(el){ rememberScroll(); const w=el.dataset.w; closeSheet();
    if(S.active==='home' && S.world===w){ S.ws[w].length=1; S.ws[w][0].y=0; }
    S.world=w; S.active='home'; render(); },
  tab(el){ rememberScroll(); S.active=el.dataset.id; closeSheet(); render(); },
  close(el){ const id=el.dataset.id, i=S.tabs.findIndex(t=>t.id===id), t=S.tabs[i]; S.tabs.splice(i,1);
    if(S.active===id) goOrigin(t); render(); },
  toOrigin(){ rememberScroll(); goOrigin(tabById(S.active)); render(); },
  review(el){ const id=el.dataset.id; S.reviewed[id]=true; log(`Max confirmed the ${EVENTS[id].name} menu`); render(true);
    toast('Menu confirmed · prototype only', ()=>{ delete S.reviewed[id]; log(`Undone: ${EVENTS[id].name} menu back to draft`); render(true); }); },
  go(el){ rememberScroll(); const p={}; for(const k of ['w','d']) if(el.dataset[k]!==undefined) p[k]=+el.dataset[k];
    for(const k of ['scope','k']) if(el.dataset[k]!==undefined) p[k]=el.dataset[k]; stack().push({s:el.dataset.s, p}); render(); },
  back(){ const s=stack(); if(s.length>1){ s.pop(); render(); } },
  openEvent(el){ closeSheet(); openTab('event', el.dataset.id, {s:'event', p:{id:el.dataset.id}}); },
  openRecipe(el){ closeSheet(); openTab('recipe', el.dataset.r, {s:'recipe', p:{id:el.dataset.r, from:el.dataset.from||''}}); },
  openIng(el){ closeSheet(); openTab('ing', el.dataset.id, {s:'ing', p:{id:el.dataset.id}}); },
  seg(el){ const e=cur(); e.p.seg=el.dataset.k; render(true); },
  mode(el){ const e=cur(); e.p.mode=el.dataset.k; render(true); },
  week(el){ const e=cur(); e.p=e.p||{}; e.p.w=+el.dataset.w; e.y=0; render(); },
  done(el){ const id=el.dataset.id, p=TODAY_PREP.find(x=>x.id===id), was=!!S.done[id];
    S.done[id]=!was; log(was?`${p.name} reopened`:`Max checked off ${p.name.toLowerCase()}`); render(true);
    if(!was) toast(`${p.name} done`, ()=>{ S.done[id]=false; log(`Undone: ${p.name.toLowerCase()} back to open`); render(true); }); },
  makeAnyway(el){ const id=el.dataset.id, p=TODAY_PREP.find(x=>x.id===id); S.makeAnyway[id]=true; log(`${p.name} moved back to today`); render(true);
    toast(`${p.name} added after lunch`, ()=>{ delete S.makeAnyway[id]; log(`Undone: ${p.name.toLowerCase()} back to tomorrow`); render(true); }); },
  fix(el){ const k=el.dataset.k; S.fixed[k]=true; log(`Max decided: ${CHECKS[k].title.toLowerCase()}`); render(true);
    toast('Decided · prototype only', ()=>{ delete S.fixed[k]; log(`Undone: ${CHECKS[k].title.toLowerCase()}`); render(true); }); },
  undo(){ const f=undoFn; undoFn=null; document.querySelectorAll('.toast').forEach(t=>t.remove()); if(f) f(); },
  why(el){ const p=TODAY_PREP.find(x=>x.id===el.dataset.id); sheet(`<div class="page"><div class="eyebrow">Why this quantity</div><h1 style="font-size:28px">${esc(p.name)} · ${fmt(prepQty(p).T)} ${p.unit}</h1><div class="answer">${WHY[p.id]}</div></div>`); },
  ask(){
    const cp = ctxPrep();
    sheet(`<div class="page"><h1 style="font-size:28px">What do you need?</h1>
      <input id="ask" class="askin" type="search" placeholder="Find, ask, record, tell someone" autocomplete="off" enterkeyhint="go">
      <div id="askout"></div>
      <section><h2>Try</h2><div class="chips">
        ${cp?`<button data-a="try" data-t="Made this">Made this<i>Uses the open tab: ${esc(cp.name)}</i></button>`:''}
        <button data-a="try" data-t="Made 5.5 kg arrabbiata">Made 5.5 kg arrabbiata<i>Records production, updates Today</i></button>
        <button data-a="try" data-t="Only 4 focaccia so far">Only 4 focaccia so far<i>Partial: the rest stays on the plan</i></button>
        <button data-a="try" data-t="Why 52 tiramisu?">Why 52 tiramisu?<i>An answer; nothing changes</i></button>
        <button data-a="try" data-t="Tell Samantha: tiramisu after 14:00, cream is in reach-in 2">Tell Samantha: tiramisu after 14:00<i>Message with preview</i></button>
        <button data-a="try" data-t="lasagna">lasagna<i>Search everywhere</i></button>
      </div></section>
      <p class="note">Demo: the phrases are interpreted by simple local rules. In the real app Chef AI would read them. Every change shows a preview first and can be undone.</p>
      <div class="list"><button class="row" data-a="reset"><span class="main"><div class="name">Reset demo</div><div class="meta">Tabs, checkmarks and decisions go back to the start</div></span></button></div></div>`);
    const i=$('ask'); let t; i.addEventListener('input',()=>{ clearTimeout(t); t=setTimeout(()=>askRun(i.value),200); });
    i.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); askRun(i.value); i.blur(); } });
  },
  try(el){ const i=$('ask'); i.value=el.dataset.t; askRun(i.value); $('askout').scrollIntoView({block:'nearest'}); },
  askCancel(){ pending=null; $('askout').innerHTML=''; },
  askConfirm(){ const a=pending; pending=null; closeSheet(); if(a) execute(a); },
  plus(){ sheet(`<div class="page"><h1 style="font-size:28px">Open in a new tab</h1>
    <section><h2>Events</h2><div class="list">${Object.keys(EVENTS).map(k=>`<button class="row" data-a="openEvent" data-id="${k}"><span class="main"><div class="name">${EVENTS[k].name}</div><div class="meta">${EVENTS[k].short}</div></span><span class="chev">›</span></button>`).join('')}</div></section>
    <section><h2>Recipes</h2><div class="list">${Object.keys(RECIPES).map(k=>`<button class="row" data-a="openRecipe" data-r="${k}"><span class="main"><div class="name">${RECIPES[k].name}</div></span><span class="chev">›</span></button>`).join('')}</div></section>
    <section><h2>Prototype</h2><div class="list">
      <button class="row" data-a="closeAll"><span class="main"><div class="name">Close all tabs</div></span></button>
      <button class="row" data-a="reset"><span class="main"><div class="name">Reset demo</div><div class="meta">Tabs, checkmarks and Chef decisions go back to the start</div></span></button>
    </div></section></div>`); },
  closeAll(){ S.tabs=[]; S.active='home'; closeSheet(); render(); },
  reset(){ S=fresh(); closeSheet(); render(); toast('Demo reset'); },
};
document.addEventListener('click', ev=>{
  const el = ev.target.closest('[data-a]'); if(!el) return;
  const f = A[el.dataset.a]; if(f){ ev.preventDefault(); f(el); }
});
window.addEventListener('resize', layout);
if(!SCREENS[cur()?.s]) S = fresh();
render();
</script>
